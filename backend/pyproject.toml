[project]
name = "projekt-zespolowy-api"
version = "0.1.0"
description = "Backend API aplikacji e-commerce"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "email-validator>=2.2.0,<3.0.0",
    "fastapi>=0.115.6,<1.0.0",
    "pydantic>=2.10.3,<3.0.0",
    "pydantic-settings>=2.6.1,<3.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3.4,<10.0.0",
    "pytest-asyncio>=0.25.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["database: integration tests requiring TEST_DATABASE_URL (PostgreSQL)"]
